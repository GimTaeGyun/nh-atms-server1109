# NH-ATMS 배포 환경 (Jenkins CI/CD)
# 구성: 백엔드 6개 모듈 + 프론트엔드 1개
#
# 서비스 / 포트 (호스트:컨테이너)
#   frontend         : 19080:80
#   atms-web         : 19081:8080
#   atms-journal     : 19082:8081
#   atms-batch       : 19083:8082
#   atms-file        : 19084:8083
#   atms-if-internal : 19085:8084
#   atms-if-external : 19086:8085
#
# DB(Oracle 19c)는 외부 서버(192.168.28.21:1521) 사용 — 컨테이너 미포함
#
# 사용법:
#   전체 시작:  docker compose up -d --remove-orphans
#   로그 확인:  docker compose logs -f atms-web
#   중지:       docker compose down
#
# .env 필수 키:
#   SPRING_DATASOURCE_PASSWORD, JWT_SECRET

# ─────────────────────────────────────────────────────────────────────
# 공통 환경변수 앵커 (YAML anchor) — 백엔드 모듈 공용
# ─────────────────────────────────────────────────────────────────────
x-backend-env: &backend-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  SPRING_DATASOURCE_URL:      ${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@//192.168.28.21:1521/ATMSPDB}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-ATMS}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
  JWT_SECRET:                 ${JWT_SECRET}
  # 모든 백엔드 모듈이 atms-common의 SecurityConfig를 상속하므로 CORS 설정 공유
  # nginx가 브라우저의 Origin 헤더를 그대로 전달하기 때문에 모든 서비스에 필요
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

services:

  # ─────────────────────────────────────────
  # atms-web : 화면 백엔드 (Web/REST)  ── 내부 8080
  # ─────────────────────────────────────────
  atms-web:
    build:
      context: ./Backend/nh-atms-api
      dockerfile: atms-web/Dockerfile
    container_name: nh-atms-web
    env_file:
      - .env
    environment:
      <<: *backend-env
      ATMR_WORKER_COUNT: 16
      ATMR_BATCH_SIZE: 100
      # 레거시 에이전트(.do)는 atms-web(19081)으로 들어오지만 처리는 atms-journal(구 atmr)이 담당.
      # atms-web 의 LegacyAgentGatewayController 가 아래 주소로 reverse-proxy 한다.
      AGENT_PROXY_JOURNAL_BASE_URL: http://atms-journal:8081
      # 원격제어/파일다운로드 MG식 서버 푸시: atms-web → atms-file(전문 송신)
      ATMF_REMOTE_SND_MSG_URI: http://atms-file:8083/api/file/remote/snd-msg
      # 개별다운로드 업로드 ZIP 저장소(atms-file과 공유 볼륨). 에이전트 전송은 atms-file이 담당.
      DOWNLOAD_STORAGE_DIR: /app/data/atms-download
    ports:
      - "19081:8080"
    volumes:
      - /home/atec/docker-volumes/nh-atms/logs:/app/logs
      - /home/atec/docker-volumes/nh-atms/images:/app/images
      # 개별다운로드 업로드 파일: atms-file과 동일 호스트 경로를 공유해야 에이전트 전송 가능
      - /home/atec/docker-volumes/nh-atms/download:/app/data/atms-download
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # atms-journal : 저널 수신/처리  ── 8081
  # ─────────────────────────────────────────
  atms-journal:
    build:
      context: ./Backend/nh-atms-api
      dockerfile: atms-journal/Dockerfile
    container_name: nh-atms-journal
    env_file:
      - .env
    environment:
      <<: *backend-env
      # 저널 스트리밍 파이프라인 (DB 저장 성공 후 Kafka 발행 → ES 색인 → Kibana 대시보드)
      ATMS_KAFKA_ENABLED: "true"
      ATMS_ES_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      # agent 개국(open.do) 응답에 내려줄 ATMS 접속정보 — agent ini 와 일치해야 저널 워커 시작
      AGENT_ATMS_HOST: ${AGENT_ATMS_HOST:-192.168.28.21}
      AGENT_ATMS_PORT: "19082"
      AGENT_ATMS_SCHEMA: http
    ports:
      - "19082:8081"
    volumes:
      - /home/atec/docker-volumes/nh-atms/logs:/app/logs
      - /home/atec/docker-volumes/nh-atms/images:/app/images
    depends_on:
      - kafka
      - elasticsearch
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # atms-batch : 배치/통계/집계  ── 8082
  # ─────────────────────────────────────────
  atms-batch:
    build:
      context: ./Backend/nh-atms-api
      dockerfile: atms-batch/Dockerfile
    container_name: nh-atms-batch
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "19083:8082"
    volumes:
      - /home/atec/docker-volumes/nh-atms/logs:/app/logs
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # atms-file : 파일/이미지/펌웨어  ── 8083
  # ─────────────────────────────────────────
  atms-file:
    build:
      context: ./Backend/nh-atms-api
      dockerfile: atms-file/Dockerfile
    container_name: nh-atms-file
    env_file:
      - .env
    environment:
      <<: *backend-env
      # 비동기 명령 결과 콜백: atms-file → atms-web(원격명령 완료 상태 갱신)
      ATMF_REMOTE_MSG_ASYNC_RESP_FORWARD_URI: http://atms-web:8080/api/remote-exec/put-msg-resp
    ports:
      - "19084:8083"
    volumes:
      - /home/atec/docker-volumes/nh-atms/logs:/app/logs
      - /home/atec/docker-volumes/nh-atms/images:/app/images
      # 개별다운로드 업로드 파일을 atms-web과 공유(에이전트 전송 시 원본 파일 접근)
      - /home/atec/docker-volumes/nh-atms/download:/app/data/atms-download
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # atms-if-internal : 대내 연계  ── 8084
  # ─────────────────────────────────────────
  atms-if-internal:
    build:
      context: ./Backend/nh-atms-api
      dockerfile: atms-if-internal/Dockerfile
    container_name: nh-atms-if-internal
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "19085:8084"
    volumes:
      - /home/atec/docker-volumes/nh-atms/logs:/app/logs
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # atms-if-external : 대외 연계  ── 8085
  # ─────────────────────────────────────────
  atms-if-external:
    build:
      context: ./Backend/nh-atms-api
      dockerfile: atms-if-external/Dockerfile
    container_name: nh-atms-if-external
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "19086:8085"
    volumes:
      - /home/atec/docker-volumes/nh-atms/logs:/app/logs
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # frontend : React + Vite (nginx)  ── 내부 80
  # /api/ 요청은 nginx가 atms-web:8080 으로 프록시
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend/nh-atms-web
      dockerfile: Dockerfile
    container_name: nh-atms-frontend
    ports:
      - "19080:80"
    depends_on:
      - atms-web
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # kafka : 저널 이벤트 스트림 (KRaft 단일 노드 — 개발용. 운영은 3노드 클러스터 권장)
  #   내부(컨테이너 간): kafka:9092 / 외부(로컬 IntelliJ): localhost:19092
  # ─────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.1
    container_name: nh-atms-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "19092:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # elasticsearch : 저널 검색/집계 (단일 노드 — 개발용)
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    container_name: nh-atms-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # 개발용. 운영 전환 시 보안 활성화 + 계정 분리 필수
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "19200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - atms-net

  # ─────────────────────────────────────────
  # kibana : 저널 운영 대시보드  ── http://localhost:19601
  #   데이터뷰: atms-journal-*  (time field: receivedAt)
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.2
    container_name: nh-atms-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      I18N_LOCALE: ko-KR
    ports:
      - "19601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - atms-net

volumes:
  kafka-data:
  es-data:

networks:
  atms-net:
    driver: bridge
