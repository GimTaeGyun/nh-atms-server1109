# =====================================================================
# nginx/default.conf — NH-ATMS 프론트엔드 nginx 설정
#
# 역할 ①  SPA 라우팅 : React Router의 클라이언트 사이드 라우팅 지원
# 역할 ②  API 프록시 : /api/* 요청을 atms-web 백엔드로 전달
# 역할 ③  정적 캐싱 : JS·CSS·이미지 파일에 장기 캐시 헤더 설정
# 역할 ④  보안 헤더 : 기본적인 HTTP 보안 헤더 추가
# =====================================================================

server {
    # ── 기본 설정 ────────────────────────────────────────────────────
    listen 80;
    server_name _;
    # server_name _ : 모든 호스트명에 응답 (IP, 도메인 무관)
    # 운영에서 특정 도메인 지정 시 변경: server_name atms.nh.co.kr;

    root /usr/share/nginx/html;
    # Vite 빌드 결과물(dist/)이 복사될 경로
    # Dockerfile에서: COPY --from=builder /app/dist /usr/share/nginx/html

    index index.html;
    # 디렉터리 요청 시 기본 파일

    # ── Gzip 압축 ────────────────────────────────────────────────────
    gzip on;
    # 응답 압축 활성화 → 네트워크 전송량 절감 (특히 JS 번들이 큰 Ant Design)

    gzip_vary on;
    # Vary: Accept-Encoding 헤더 추가
    # CDN/프록시가 압축 여부에 따라 다른 캐시를 유지하도록 지시

    gzip_min_length 1024;
    # 1KB 미만 파일은 압축하지 않음 (압축 오버헤드가 이득보다 클 수 있음)

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # 압축 대상 MIME 타입 (바이너리인 이미지는 이미 압축되어 있으므로 제외)

    # ── 보안 헤더 ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 클릭재킹 방지: 동일 출처의 iframe만 허용

    add_header X-Content-Type-Options "nosniff" always;
    # MIME 타입 스니핑 방지: 브라우저가 Content-Type을 변경하지 못하게 함

    add_header X-XSS-Protection "1; mode=block" always;
    # 구형 브라우저용 XSS 필터 활성화

    # ── ① SPA 라우팅 ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # 동작 순서:
        #   1. $uri       : 요청 경로에 해당하는 파일이 있으면 그대로 반환
        #                   예) /nh_logo.png → 실제 파일 반환
        #   2. $uri/      : 디렉터리면 index.html 반환 시도
        #   3. /index.html : 위 두 가지 모두 없으면 항상 index.html 반환
        #                   예) /dashboard, /atm/list 등 React Router 경로
        #
        # 이 설정이 없으면 /dashboard 새로고침 시 404 에러 발생
    }

    # ── Docker 내부 DNS 설정 ──────────────────────────────────────────
    resolver 127.0.0.11 valid=30s ipv6=off;
    # 127.0.0.11 : Docker가 모든 컨테이너에 제공하는 내장 DNS 서버
    #              이 서버가 "atms-web" 같은 서비스명을 컨테이너 IP로 변환함
    #
    # valid=30s  : DNS 캐시 유효 시간 30초
    #              30초마다 재조회 → 컨테이너 재시작으로 IP가 바뀌어도 자동 갱신
    #
    # ipv6=off   : IPv6 조회 비활성화 (Docker 내부 네트워크는 IPv4만 사용)
    #
    # 왜 필요한가?
    #   resolver 없이 proxy_pass에 호스트명을 직접 쓰면
    #   nginx가 시작 시점에 DNS를 조회하려 하는데,
    #   이 때 atms-web 컨테이너가 아직 준비되지 않으면 → [emerg] host not found

    # ── ② API 프록시 ─────────────────────────────────────────────────
    #
    # ※ nginx prefix location 매칭 규칙:
    #   더 긴(구체적인) 경로가 항상 우선 적용됨.
    #   /api/batch/ 는 /api/ 보다 길므로 배치 요청은 반드시 아래 블록으로 진입.
    #   (선언 순서와 무관하지만 가독성을 위해 구체적인 것을 먼저 선언)

    # ── ②-A  배치 관리 API → atms-batch (8082) ───────────────────────
    #
    # 로컬 개발: vite.config.ts 의 '/api/batch' 프록시 규칙과 동일한 분기.
    # atms-web(8080) 에는 BatchJobController 가 없고
    # atms-batch(8082) 에만 존재하므로 반드시 별도 분기 필요.
    location /api/batch/ {
        set $batch_backend http://atms-batch:8082;
        proxy_pass $batch_backend;
        # 경로 보존: /api/batch/jobs → http://atms-batch:8082/api/batch/jobs

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         4 64k;
    }

    # ── ②-B  일반 API → atms-web (8080) ─────────────────────────────
    location /api/ {
        # set $backend 변수에 주소를 담는 이유:
        #   nginx는 proxy_pass에 변수가 있으면 DNS 조회를 startup이 아닌
        #   '요청이 들어오는 시점'으로 미룸 (lazy resolution)
        #   → atms-web이 나중에 떠도 nginx가 먼저 시작 가능
        #   → atms-web 재시작 후 IP가 바뀌어도 자동으로 새 IP로 연결
        set $backend http://atms-web:8080;
        proxy_pass $backend;
        # 경로 보존: /api/auth/login → http://atms-web:8080/api/auth/login

        # ── 프록시 헤더 ────────────────────────────────────────────
        proxy_set_header Host              $host;
        # 원본 Host 헤더 전달 (가상 호스팅이나 도메인 검증에 필요)

        proxy_set_header X-Real-IP         $remote_addr;
        # 실제 클라이언트 IP 전달 (nginx가 중간에서 IP를 가리지 않도록)

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 프록시 체인의 전체 IP 목록 전달 (로드밸런서가 여러 개일 때도 추적 가능)

        proxy_set_header X-Forwarded-Proto $scheme;
        # 원본 프로토콜(http/https) 전달
        # 백엔드가 리다이렉트 URL 생성 시 올바른 프로토콜 사용하도록

        # ── 타임아웃 설정 ─────────────────────────────────────────
        proxy_connect_timeout 10s;
        # 백엔드 연결 수립 최대 대기 시간

        proxy_read_timeout    60s;
        # 백엔드 응답 최대 대기 시간 (배치 API 등 처리 시간이 긴 경우 대비)

        proxy_send_timeout    60s;
        # 백엔드로 요청 전송 최대 시간

        # ── 버퍼링 설정 ─────────────────────────────────────────
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         4 64k;
        # 백엔드 응답을 nginx 메모리에 버퍼링
        # 클라이언트가 느려도 백엔드 연결을 빨리 해제 가능
    }

    # ── ③ 정적 자산 장기 캐싱 ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        # 브라우저 캐시 1년 유지

        add_header Cache-Control "public, immutable";
        # public   : CDN/프록시도 캐싱 허용
        # immutable : 파일이 절대 변경되지 않음을 브라우저에 알림
        #             → 유효 기간 내 재검증 요청(304) 조차 보내지 않음
        #
        # 안전성 이유: Vite는 빌드 시 파일명에 해시를 포함
        #   예) assets/index-Dh8e9xKr.js (내용이 바뀌면 해시도 바뀜)
        #   → 파일명 자체가 버전이므로 1년 캐싱해도 구 버전 파일이 보일 위험 없음

        access_log off;
        # 정적 파일 접근 로그 비활성화 → 로그 노이즈 감소
    }

    # ── index.html 캐시 금지 ──────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        # index.html은 캐싱하지 않음
        # 이유: 새 배포 시 새 JS 파일 해시가 index.html에 반영되는데,
        #       index.html이 캐싱되면 브라우저가 구 버전 JS를 참조하게 됨
        expires 0;
    }

    # ── 에러 페이지 ─────────────────────────────────────────────────
    error_page 404 /index.html;
    # 404도 index.html로 → React Router가 Not Found 처리

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
