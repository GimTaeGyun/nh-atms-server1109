server:
  port: 8082

spring:
  application:
    name: atms-batch
  profiles:
    active: local
    # local  → 로컬 IntelliJ 기본값 (application-local.yml 함께 로드)
    # dev    → Docker Compose: SPRING_PROFILES_ACTIVE=dev 환경변수가 이 값을 덮어씀
    # prod   → CI/CD 배포 시 Jenkins Credentials에서 주입
  # Oracle 19C — atms-web 과 동일 DB 공유 (T_BATCHJOB 등)
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//192.168.28.21:1521/ATMSPDB}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${SPRING_DATASOURCE_USERNAME:ATMS}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      pool-name: AtmsBatchHikariCP
      connection-init-sql: "ALTER SESSION SET TIME_ZONE = 'Asia/Seoul'"
  batch:
    jdbc:
      initialize-schema: never
      table-prefix: BATCH_
      # Oracle 19c 는 SERIALIZABLE(기본값) 에서 신규 INSERT 시 ORA-08177 발생 → READ_COMMITTED 로 변경
      isolation-level-for-create: READ_COMMITTED
    job:
      enabled: false   # 부팅 시 Job 자동 실행 방지 — 실행은 DynamicBatchScheduler/REST → JobLauncher 경유
  quartz:
    job-store-type: memory

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: kr.co.nh.atms.batch
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000
  refresh-token-validity: 86400000

logging:
  level:
    kr.co.nh.atms: DEBUG

# ── CORS 허용 Origin ─────────────────────────────────────────────────
# nginx가 브라우저 Origin 헤더를 atms-batch 로 그대로 전달하므로 설정 필요
# 서버 배포 시: docker-compose의 CORS_ALLOWED_ORIGINS 환경변수가 이 값을 덮어씀
cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173"

sso:
  provider: mock

# ── 배치 공통/잡별 설정 ───────────────────────────────────────────────
atms:
  batch:
    bank-cd: "011"          # 자행(NH) 은행코드 — batday02/08/09 자행·타행 판정 기준
    batday99:               # 파일 정리 배치 (AS-IS atmb config.json batday99 이식)
      jnl-img-root: ""      # 저널 이미지 루트(yyyyMMdd 하위 디렉토리). 빈 값이면 스킵
      jnl-img-months: -3    # 이미지 보관개월(음수)
      targets: []           # 예) - path: /nas/temp
                            #       days: -7
