# JDK는 Gradle Toolchain이 자동 관리 (Eclipse Temurin 21)
# settings.gradle의 foojay-resolver-convention 플러그인이 필요 시 자동 다운로드

# 빌드 성능
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Dnative.encoding=UTF-8

# Alpine Linux(musl libc) 환경 호환성
# Gradle 네이티브 파일감시 라이브러리(libgradle-fileevents.so)는 glibc 기반으로 컴파일되어
# Alpine(musl libc) 컨테이너에서 UnsatisfiedLinkError 발생.
# org.gradle.native=false 만으로는 해결 불가(라이브러리 초기화가 속성 로드 이전에 발생).
# → 근본 해결: 모든 Dockerfile을 eclipse-temurin:21-jdk-alpine → eclipse-temurin:21-jdk-jammy 로 변경
#   (Ubuntu 22.04 Jammy = glibc 기반, ld-linux-x86-64.so.2 존재)
# 아래 속성은 보조적 안전장치로 유지
org.gradle.native=false
