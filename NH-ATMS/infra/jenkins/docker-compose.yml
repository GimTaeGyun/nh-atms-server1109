# =====================================================================
# NH-ATMS Jenkins CI/CD 서버 구성
#
# 실행 위치: NH-ATMS/infra/jenkins/
# 실행 명령:
#   docker compose up -d            # Jenkins 기동
#   docker compose down             # Jenkins 종료
#   docker compose logs -f jenkins  # 로그 확인
#
# 사전 조건:
#   - 같은 디렉터리에 .env 파일 필요 (.env.example 참고)
#   - 호스트에 Docker가 설치되어 있어야 함 (/var/run/docker.sock 공유)
#
# 접속 주소: http://호스트IP:8090
# =====================================================================

name: nh-atms-jenkins

networks:
  jenkins-net:
    driver: bridge
    # 애플리케이션 네트워크(atms-net)와 분리
    # Jenkins는 독립적인 네트워크에서 운영

volumes:
  jenkins-home:
    # Jenkins 설정, 빌드 이력, 플러그인 데이터 영속 저장
    # 컨테이너 재시작·업데이트 시에도 모든 데이터 유지

services:

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      # Dockerfile: Docker CLI 설치 + 플러그인 사전 설치 + JCasC 설정 복사
    image: nh-atms-jenkins:latest
    # 빌드된 이미지에 태그 지정 → 이후 pull/push 시 사용
    pull_policy: build
    # pull_policy: build → docker compose up 시 DockerHub Pull 시도 없이
    #   항상 로컬 Dockerfile로 빌드 (또는 캐시 사용)
    #   기본값(missing)은 이미지가 없을 때 DockerHub Pull을 먼저 시도하여
    #   "pull access denied for nh-atms-jenkins" 경고 후 빌드로 폴백됨
    container_name: nh-atms-jenkins
    ports:
      - "${JENKINS_HTTP_PORT:-8090}:8080"
      # 8090 → 8080 : Jenkins 웹 UI 접속 포트
      # 8080은 atms-web이 사용하므로 8090으로 분리
      - "${JENKINS_AGENT_PORT:-50000}:50000"
      # 50000 : Jenkins 에이전트(빌드 노드) 연결 포트
      # 에이전트를 추가할 때 이 포트로 마스터와 통신

    volumes:
      - jenkins-home:/var/jenkins_home
      # Jenkins 홈 디렉터리: 모든 설정·플러그인·빌드 이력 저장

      - /var/run/docker.sock:/var/run/docker.sock
      # 호스트의 Docker 소켓을 컨테이너 내부로 공유
      #
      # 동작 원리:
      #   Jenkins 컨테이너 내 Docker CLI
      #     → /var/run/docker.sock (IPC)
      #     → 호스트 Docker 데몬
      #     → 실제 이미지 빌드·컨테이너 실행
      #
      # 보안 고려: 소켓을 공유하면 Jenkins가 호스트 Docker 전체를 제어 가능
      #   → Jenkins 관리자 계정 보안이 매우 중요
      #   → 신뢰할 수 있는 내부 환경에서만 사용

    environment:
      # ── JVM 설정 ────────────────────────────────────────────────
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dfile.encoding=UTF-8
        -Dhudson.model.DirectoryBrowserSupport.CSP=
      # runSetupWizard=false : 최초 기동 시 설정 마법사 건너뜀
      #                        JCasC(jenkins.yaml)가 대신 자동 구성
      # CSP= : Jenkins 내 HTML 리포트 렌더링 허용 (테스트 리포트 등)

      # ── JCasC 환경변수 ──────────────────────────────────────────
      # casc/jenkins.yaml의 ${변수} 를 여기서 주입
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_ADMIN_EMAIL: ${JENKINS_ADMIN_EMAIL:-admin@nh-atms.local}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8090/}

      # ── GitLab OAuth (securityRealm: gitLab) ────────────────────
      # GitLab Admin Area > Applications 에서 발급
      # Phase 1에서 생성한 OAuth App 의 Client ID / Secret
      GITLAB_CLIENT_ID:     ${GITLAB_CLIENT_ID}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET}

    restart: unless-stopped
    networks:
      - jenkins-net

    healthcheck:
      # Jenkins가 실제로 응답 가능한 상태인지 확인
      # /login 페이지는 인증 없이 접근 가능 → 200 응답 확인
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login | grep -q 'Jenkins' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      # start_period: 120s — Jenkins 최초 기동 시 플러그인 초기화에 시간 소요
