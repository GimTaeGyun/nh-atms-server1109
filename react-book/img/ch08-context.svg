<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 176">
  <defs>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-blue"/></marker>
  </defs>

  <!-- Provider 로 감싼 안쪽 -->
  <rect class="box-blue" x="2" y="2" width="410" height="172"/>
  <text class="t-b" x="14" y="22">② 걸기</text>
  <text class="t-mono" x="62" y="22">&lt;ScreenIdProvider screenKey="sample.notice"&gt;</text>

  <rect class="box" x="14" y="36" width="386" height="126"/>
  <text x="26" y="56">PageFrame</text>
  <text class="t-sm t-gray" x="388" y="56" text-anchor="end">화면키를 받아 넘기지 않아도 된다</text>

  <rect class="box" x="26" y="68" width="362" height="82"/>
  <text x="38" y="88">ActionBar</text>

  <rect class="box-yellow" x="38" y="100" width="338" height="38"/>
  <text x="50" y="124">AuthButton</text>
  <text class="t-b" x="140" y="118">③ 꺼내기</text>
  <text class="t-mono" x="140" y="132">useScreenId() → 'sample.notice'</text>

  <path class="line-blue" d="M396,18 H406 V119 H377" marker-end="url(#arrowb)"/>

  <!-- 바깥 -->
  <rect class="box-gray" x="430" y="60" width="168" height="78"/>
  <text x="514" y="82" text-anchor="middle">Provider 바깥의 부품</text>
  <text class="t-mono" x="514" y="106" text-anchor="middle">useScreenId()</text>
  <text class="t-mono" x="514" y="124" text-anchor="middle">→ undefined (기본값)</text>
</svg>
