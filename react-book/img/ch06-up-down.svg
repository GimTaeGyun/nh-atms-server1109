<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 132">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-blue"/></marker>
  </defs>

  <!-- 부모 -->
  <rect x="160" y="4" width="280" height="38" class="box-blue"/>
  <text x="300" y="20" text-anchor="middle" class="t-b">NoticePage (부모)</text>
  <text x="300" y="35" text-anchor="middle">팝업이 열렸는지 기억한다</text>

  <!-- 자식 -->
  <rect x="160" y="92" width="280" height="38" class="box"/>
  <text x="174" y="116" class="t-b">NoticeViewModal (자식)</text>
  <rect x="330" y="100" width="46" height="22" class="box-gray"/>
  <text x="353" y="115" text-anchor="middle">닫기</text>
  <rect x="382" y="100" width="46" height="22" class="box-solid"/>
  <text x="405" y="115" text-anchor="middle" class="t-white">수정</text>

  <!-- 내려가는 화살표: props -->
  <path d="M222,42 L222,90" class="line" marker-end="url(#arrow)"/>
  <text x="210" y="56" text-anchor="end" class="t-b">props로 건넨다</text>
  <text x="210" y="71" text-anchor="end" class="t-mono">open · notice · loading</text>
  <text x="210" y="86" text-anchor="end" class="t-mono">onClose · onEdit</text>

  <!-- 올라가는 화살표: 받은 함수를 부른다 -->
  <path d="M378,92 L378,44" class="line-blue" marker-end="url(#arrow-blue)"/>
  <text x="390" y="56" class="t-b t-blue">받은 함수를 부른다</text>
  <text x="390" y="71" class="t-mono">onClose()</text>
  <text x="390" y="86" class="t-mono">onEdit(notice)</text>
</svg>
