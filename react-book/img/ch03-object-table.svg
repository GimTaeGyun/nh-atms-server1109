  <text class="t-mono" x="2" y="146">];</text>

  <!-- 화살표: 객체 하나 → 행 하나 -->
  <path class="line" d="M350,58 H378" marker-end="url(#arrow)"/>
  <path class="line" d="M350,86 H378" marker-end="url(#arrow)"/>
  <path class="line" d="M350,114 H378" marker-end="url(#arrow)"/>

