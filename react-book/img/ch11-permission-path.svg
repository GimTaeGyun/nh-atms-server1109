<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 178">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <text x="58" y="14" text-anchor="middle" class="t-b t-gray">값이 오는 곳</text>
  <text x="240" y="14" text-anchor="middle" class="t-b t-gray">스토어</text>
  <text x="428" y="14" text-anchor="middle" class="t-b t-gray">훅</text>
  <text x="552" y="14" text-anchor="middle" class="t-b t-gray">버튼줄</text>

  <!-- 값이 오는 곳 -->
  <rect x="8" y="26" width="100" height="38" class="box"/>
  <text x="58" y="42" text-anchor="middle">서버가 준</text>
  <text x="58" y="58" text-anchor="middle">로그인한 사람</text>
  <rect x="8" y="76" width="100" height="38" class="box"/>
  <text x="58" y="92" text-anchor="middle">서버가 준</text>
  <text x="58" y="108" text-anchor="middle">메뉴와 권한</text>
  <rect x="8" y="126" width="100" height="38" class="box-dash"/>
  <text x="58" y="142" text-anchor="middle" class="t-gray">화면에서 켜는</text>
  <text x="58" y="158" text-anchor="middle" class="t-gray">미리보기 스위치</text>

  <!-- 스토어 -->
  <rect x="150" y="26" width="180" height="38" class="box-blue"/>
  <text x="240" y="41" text-anchor="middle" class="t-mono t-b">useAuthStore</text>
  <text x="240" y="57" text-anchor="middle">me: 관리자인가</text>
  <rect x="150" y="76" width="180" height="38" class="box-blue"/>
  <text x="240" y="91" text-anchor="middle" class="t-mono t-b">useNavStore</text>
  <text x="240" y="107" text-anchor="middle">menus: 화면마다 권한 5가지</text>
  <rect x="150" y="126" width="180" height="38" class="box-blue"/>
  <text x="240" y="141" text-anchor="middle" class="t-mono t-b">usePermPreviewStore</text>
  <text x="240" y="157" text-anchor="middle">preview: 미리보기 값</text>

  <path d="M108,45 L149,45" class="line" marker-end="url(#arrow)"/>
  <path d="M108,95 L149,95" class="line" marker-end="url(#arrow)"/>
  <path d="M108,145 L149,145" class="line-dash" marker-end="url(#arrow)"/>

  <!-- 훅 -->
  <rect x="372" y="67" width="112" height="56" class="box-yellow"/>
  <text x="428" y="91" text-anchor="middle" class="t-mono t-b">usePermission</text>
  <text x="428" y="108" text-anchor="middle" class="t-mono">('sample.notice')</text>

  <path d="M330,45 L371,78" class="line" marker-end="url(#arrow)"/>
  <path d="M330,95 L371,95" class="line" marker-end="url(#arrow)"/>
  <path d="M330,145 L371,112" class="line" marker-end="url(#arrow)"/>

  <text x="428" y="142" text-anchor="middle" class="t-mono t-blue">canQry: true</text>
  <text x="428" y="157" text-anchor="middle" class="t-mono t-blue">canReg: false</text>
  <text x="428" y="172" text-anchor="middle" class="t-mono t-blue">canDel: false …</text>

  <!-- 버튼줄 -->
  <rect x="512" y="67" width="80" height="56" class="box"/>
  <text x="552" y="99.5" text-anchor="middle">ActionBar</text>
  <path d="M484,95 L511,95" class="line" marker-end="url(#arrow)"/>
  <path d="M552,123 L552,135" class="line" marker-end="url(#arrow)"/>

  <rect x="512" y="136" width="37" height="24" class="box-solid"/>
  <text x="530.5" y="152.5" text-anchor="middle" class="t-white">조회</text>
  <rect x="555" y="136" width="37" height="24" class="box-gray"/>
  <text x="573.5" y="152.5" text-anchor="middle" class="t-gray">등록</text>
  <text x="552" y="175" text-anchor="middle">등록은 흐리게</text>
</svg>
