<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 144">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-blue"/></marker>
  </defs>

  <!-- 원본 prev -->
  <text class="t-mono t-b" x="2" y="27">prev</text>
  <rect class="box" x="46" y="8" width="110" height="30"/>
  <text class="t-mono" x="101" y="27" text-anchor="middle">keyword: '점검'</text>
  <rect class="box" x="156" y="8" width="140" height="30"/>
  <text class="t-mono" x="226" y="27" text-anchor="middle">page: 1</text>
  <rect class="box" x="296" y="8" width="90" height="30"/>
  <text class="t-mono" x="341" y="27" text-anchor="middle">size: 20</text>
  <text class="t-sm t-gray" x="398" y="27">원본은 그대로 남는다</text>

  <!-- ① 세 칸을 모두 베낀다 -->
  <path class="line" d="M101,38 V64" marker-end="url(#arrow)"/>
  <path class="line" d="M226,38 V64" marker-end="url(#arrow)"/>
  <path class="line" d="M341,38 V64" marker-end="url(#arrow)"/>
  <text class="t-sm" x="398" y="55">① <tspan class="t-mono">...prev</tspan>가 세 칸을 모두 베낀다</text>

  <!-- 새 객체 next -->
  <text class="t-mono t-b" x="2" y="85">next</text>
  <rect class="box" x="46" y="66" width="110" height="30"/>
  <text class="t-mono" x="101" y="85" text-anchor="middle">keyword: '점검'</text>
  <rect class="box-yellow" x="156" y="66" width="140" height="30"/>
  <text class="t-mono t-gray" x="191" y="85" text-anchor="middle">page: 1</text>
  <path class="line" d="M170,81 H212"/>
  <text class="t-mono t-b" x="261" y="85" text-anchor="middle">page: 2</text>
  <rect class="box" x="296" y="66" width="90" height="30"/>
  <text class="t-mono" x="341" y="85" text-anchor="middle">size: 20</text>
  <text class="t-sm t-gray" x="398" y="85">새로 만든 객체</text>

  <!-- ② 뒤에 적은 page: 2가 덮어쓴다 -->
  <rect class="box-yellow" x="216" y="112" width="90" height="28"/>
  <text class="t-mono" x="261" y="130" text-anchor="middle">page: 2</text>
  <path class="line-blue" d="M261,112 V99" marker-end="url(#arrow-b)"/>
  <text class="t-sm t-blue" x="316" y="130">② 뒤에 적은 <tspan class="t-mono">page: 2</tspan>가 덮어쓴다</text>
</svg>
