<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 188">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <!-- 번호표 -->
  <rect x="190" y="6" width="220" height="176" class="box"/>
  <rect x="190" y="6" width="220" height="28" class="box-solid"/>
  <text x="300" y="25" text-anchor="middle" class="t-b t-white">번 호 표</text>

  <text x="300" y="56" text-anchor="middle" class="t-sm t-gray">대기번호</text>
  <g transform="translate(300 106) scale(3.2)">
    <text x="0" y="0" text-anchor="middle" class="t-lg t-blue">14</text>
  </g>
  <text x="300" y="128" text-anchor="middle">앞선 차례 13장</text>

  <line x1="202" y1="140" x2="398" y2="140" class="line-dash"/>

  <text x="300" y="158" text-anchor="middle" class="t-b">14번 창구</text>
  <text x="300" y="174" text-anchor="middle">공지사항 화면 만들기</text>

  <!-- 왼쪽 설명 -->
  <text x="150" y="84" text-anchor="end">번호는 이 책의 마지막 장,</text>
  <text x="150" y="101" text-anchor="end" class="t-b">14장</text>
  <line x1="158" y1="90" x2="262" y2="90" class="line" marker-end="url(#arrow)"/>

  <!-- 오른쪽 설명 -->
  <text x="450" y="119" text-anchor="start">1장부터 13장까지는</text>
  <text x="450" y="136" text-anchor="start">차례를 기다리며 준비하는 시간</text>
  <line x1="442" y1="124" x2="352" y2="124" class="line" marker-end="url(#arrow)"/>
</svg>
