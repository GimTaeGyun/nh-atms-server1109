<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 206">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <!-- 왼쪽: 화면을 여는 세 가지 길 -->
  <text x="76" y="20" text-anchor="middle" class="t-gray">화면을 여는 길</text>
  <rect x="8" y="32" width="136" height="34" class="box-gray"/>
  <text x="76" y="53.5" text-anchor="middle">메뉴·홈 카드 클릭</text>
  <rect x="8" y="84" width="136" height="34" class="box-gray"/>
  <text x="76" y="105.5" text-anchor="middle">탭 클릭</text>
  <rect x="8" y="136" width="136" height="34" class="box-gray"/>
  <text x="76" y="157.5" text-anchor="middle">주소창에 직접 입력</text>

  <path d="M144,49 L190,88" class="line" marker-end="url(#arrow)"/>
  <path d="M144,101 L190,101" class="line" marker-end="url(#arrow)"/>
  <path d="M144,153 L190,114" class="line" marker-end="url(#arrow)"/>

  <!-- 가운데: 주소 -->
  <rect x="192" y="72" width="132" height="58" class="box-yellow"/>
  <text x="258" y="94" text-anchor="middle" class="t-b">주소가 바뀐다</text>
  <text x="258" y="115" text-anchor="middle" class="t-mono">/sample/notice</text>

  <path d="M324,101 H344 V58 H366" class="line" marker-end="url(#arrow)"/>

  <!-- 오른쪽: ScreenHost -->
  <rect x="356" y="8" width="238" height="192" class="box-dash"/>
  <text x="368" y="27" class="t-mono t-b">ScreenHost</text>

  <rect x="368" y="36" width="214" height="44" class="box"/>
  <text x="475" y="54" text-anchor="middle" class="t-b">① 주소를 화면키로 바꾼다</text>
  <text x="475" y="71" text-anchor="middle" class="t-mono t-blue">sample.notice</text>

  <path d="M475,80 V90" class="line" marker-end="url(#arrow)"/>

  <rect x="368" y="92" width="214" height="44" class="box"/>
  <text x="475" y="110" text-anchor="middle" class="t-b">② 등록부에서 화면을 찾는다</text>
  <text x="475" y="127" text-anchor="middle" class="t-mono t-blue">NoticePage</text>

  <path d="M475,136 V146" class="line" marker-end="url(#arrow)"/>

  <rect x="368" y="148" width="214" height="44" class="box-blue"/>
  <text x="475" y="166" text-anchor="middle" class="t-b">③ 탭을 열고 화면을 그린다</text>
  <text x="475" y="183" text-anchor="middle">열린 탭: 홈, 공지사항</text>
</svg>
