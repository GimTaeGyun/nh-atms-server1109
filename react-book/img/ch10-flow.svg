<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 178">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <!-- 왼쪽: 화면을 여는 세 가지 길 -->
  <text x="76" y="17" text-anchor="middle" class="t-gray">화면을 여는 길</text>
  <rect x="8" y="27" width="136" height="32" class="box-gray"/>
  <text x="76" y="47.5" text-anchor="middle">메뉴·홈 카드 클릭</text>
  <rect x="8" y="73" width="136" height="32" class="box-gray"/>
  <text x="76" y="93.5" text-anchor="middle">탭 클릭</text>
  <rect x="8" y="119" width="136" height="32" class="box-gray"/>
  <text x="76" y="139.5" text-anchor="middle">주소창에 직접 입력</text>

  <path d="M144,43 L190,79" class="line" marker-end="url(#arrow)"/>
  <path d="M144,89 L190,89" class="line" marker-end="url(#arrow)"/>
  <path d="M144,135 L190,99" class="line" marker-end="url(#arrow)"/>

  <!-- 가운데: 주소 -->
  <rect x="192" y="60" width="132" height="58" class="box-yellow"/>
  <text x="258" y="82" text-anchor="middle" class="t-b">주소가 바뀐다</text>
  <text x="258" y="103" text-anchor="middle" class="t-mono">/sample/notice</text>

  <path d="M324,89 H344 V52 H366" class="line" marker-end="url(#arrow)"/>

  <!-- 오른쪽: ScreenHost -->
  <rect x="356" y="5" width="238" height="168" class="box-dash"/>
  <text x="368" y="23" class="t-mono t-b">ScreenHost</text>

  <rect x="368" y="32" width="214" height="40" class="box"/>
  <text x="475" y="48" text-anchor="middle" class="t-b">주소를 화면키로 바꾼다</text>
  <text x="475" y="65" text-anchor="middle" class="t-mono t-blue">sample.notice</text>

  <path d="M475,72 V80" class="line" marker-end="url(#arrow)"/>

  <rect x="368" y="82" width="214" height="40" class="box"/>
  <text x="475" y="98" text-anchor="middle" class="t-b">등록부에서 화면을 찾는다</text>
  <text x="475" y="115" text-anchor="middle" class="t-mono t-blue">NoticePage</text>

  <path d="M475,122 V130" class="line" marker-end="url(#arrow)"/>

  <rect x="368" y="132" width="214" height="40" class="box-blue"/>
  <text x="475" y="148" text-anchor="middle" class="t-b">탭을 열고 화면을 그린다</text>
  <text x="475" y="165" text-anchor="middle">열린 탭: 홈, 공지사항</text>
</svg>
