<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 188">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <!-- 칸 머리 -->
  <text class="t-sm t-gray" x="179" y="12" text-anchor="middle">함수가 JSX를 돌려준다</text>
  <text class="t-sm t-gray" x="297" y="12" text-anchor="middle">달라진 곳을 고친다</text>
  <text class="t-sm t-gray" x="415" y="12" text-anchor="middle">지난 effect의 뒷정리</text>
  <text class="t-sm t-gray" x="533" y="12" text-anchor="middle">맡겨 둔 일</text>

  <!-- 1줄: 처음 그릴 때 -->
  <text class="t-b" x="2" y="43">처음 그릴 때</text>
  <rect class="box" x="126" y="24" width="106" height="30"/>
  <text x="179" y="43.5" text-anchor="middle">렌더링</text>
  <path class="line" d="M232,39 H243" marker-end="url(#arrow)"/>
  <rect class="box" x="244" y="24" width="106" height="30"/>
  <text x="297" y="43.5" text-anchor="middle">화면 고치기</text>
  <path class="line" d="M350,39 H479" marker-end="url(#arrow)"/>
  <rect class="box-blue" x="480" y="24" width="106" height="30"/>
  <text class="t-b" x="533" y="43.5" text-anchor="middle">effect 실행</text>

  <!-- 2줄: 의존성이 바뀐 다시 렌더링 -->
  <text class="t-b" x="2" y="87">의존성이 바뀐</text>
  <text class="t-b" x="2" y="104">다시 렌더링</text>
  <rect class="box" x="126" y="76" width="106" height="30"/>
  <text x="179" y="95.5" text-anchor="middle">다시 렌더링</text>
  <path class="line" d="M232,91 H243" marker-end="url(#arrow)"/>
  <rect class="box" x="244" y="76" width="106" height="30"/>
  <text x="297" y="95.5" text-anchor="middle">화면 고치기</text>
  <path class="line" d="M350,91 H361" marker-end="url(#arrow)"/>
  <rect class="box-yellow" x="362" y="76" width="106" height="30"/>
  <text class="t-b" x="415" y="95.5" text-anchor="middle">정리 함수</text>
  <path class="line" d="M468,91 H479" marker-end="url(#arrow)"/>
  <rect class="box-blue" x="480" y="76" width="106" height="30"/>
  <text class="t-b" x="533" y="95.5" text-anchor="middle">effect 실행</text>

  <!-- 3줄: 화면에서 사라질 때 -->
  <text class="t-b" x="2" y="147">화면에서 사라질 때</text>
  <rect class="box-dash" x="126" y="128" width="224" height="30"/>
  <text class="t-gray" x="238" y="147.5" text-anchor="middle">컴포넌트가 화면에서 빠진다</text>
  <path class="line" d="M350,143 H361" marker-end="url(#arrow)"/>
  <rect class="box-yellow" x="362" y="128" width="106" height="30"/>
  <text class="t-b" x="415" y="147.5" text-anchor="middle">정리 함수</text>

  <text class="t-sm" x="126" y="180">의존성이 그대로인 다시 렌더링에서는 정리 함수도 effect도 건너뛴다.</text>
</svg>
