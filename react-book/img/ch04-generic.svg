<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 134">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <!-- 빈칸이 있는 양식 -->
  <text x="4" y="14"><tspan class="t-b">PageResult&lt;T&gt;</tspan><tspan class="t-gray" dx="8">빈칸 T를 뚫어 둔 양식</tspan></text>
  <rect x="2" y="24" width="214" height="106" class="box"/>
  <text x="16" y="50" class="t-mono">content:</text>
  <rect x="68" y="35" width="24" height="22" class="box-yellow"/>
  <text x="80" y="50" text-anchor="middle" class="t-mono t-b">T</text>
  <text x="96" y="50" class="t-mono">[]</text>
  <text x="16" y="76" class="t-mono">totalCount: number</text>
  <text x="16" y="98" class="t-mono">page: number</text>
  <text x="114" y="98" class="t-mono">size: number</text>
  <text x="16" y="120" class="t-mono">totalPages: number</text>

  <!-- 화살표 -->
  <path d="M216,56 L366,44" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="40" text-anchor="middle">T 자리에 Notice</text>
  <path d="M216,98 L366,110" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="125" text-anchor="middle">T 자리에 McnInfo</text>

  <!-- 공지 목록 -->
  <text x="372" y="14"><tspan class="t-b">PageResult&lt;Notice&gt;</tspan><tspan class="t-gray" dx="8">공지 목록</tspan></text>
  <rect x="370" y="20" width="228" height="46" class="box-blue"/>
  <text x="384" y="38" class="t-mono">content:</text>
  <rect x="436" y="24" width="50" height="20" class="box-yellow"/>
  <text x="461" y="38" text-anchor="middle" class="t-mono t-b">Notice</text>
  <text x="490" y="38" class="t-mono">[]</text>
  <text x="384" y="59" class="t-gray">나머지 4칸은 양식 그대로</text>

  <!-- 기기정보 목록 -->
  <text x="372" y="84"><tspan class="t-b">PageResult&lt;McnInfo&gt;</tspan><tspan class="t-gray" dx="8">기기정보 목록</tspan></text>
  <rect x="370" y="88" width="228" height="44" class="box-blue"/>
  <text x="384" y="106" class="t-mono">content:</text>
  <rect x="436" y="92" width="56" height="20" class="box-yellow"/>
  <text x="464" y="106" text-anchor="middle" class="t-mono t-b">McnInfo</text>
  <text x="496" y="106" class="t-mono">[]</text>
  <text x="384" y="126" class="t-gray">나머지 4칸은 양식 그대로</text>
</svg>
