<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 162">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <!-- 빈칸이 있는 양식 -->
  <text x="4" y="14"><tspan class="t-b">PageResult&lt;T&gt;</tspan><tspan class="t-gray" dx="8">빈칸 T를 뚫어 둔 양식</tspan></text>
  <rect x="2" y="24" width="214" height="134" class="box"/>
  <text x="16" y="49" class="t-mono">content:</text>
  <rect x="68" y="34" width="24" height="22" class="box-yellow"/>
  <text x="80" y="49" text-anchor="middle" class="t-mono t-b">T</text>
  <text x="96" y="49" class="t-mono">[]</text>
  <text x="16" y="74" class="t-mono">totalCount: number</text>
  <text x="16" y="98" class="t-mono">page: number</text>
  <text x="16" y="122" class="t-mono">size: number</text>
  <text x="16" y="146" class="t-mono">totalPages: number</text>

  <!-- 화살표 -->
  <path d="M216,66 L366,48" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="43" text-anchor="middle">T 자리에 Notice</text>
  <path d="M216,116 L366,134" class="line" marker-end="url(#arrow)"/>
  <text x="290" y="146" text-anchor="middle">T 자리에 McnInfo</text>

  <!-- 공지 목록 -->
  <text x="372" y="14"><tspan class="t-b">PageResult&lt;Notice&gt;</tspan><tspan class="t-gray" dx="8">공지 목록</tspan></text>
  <rect x="370" y="24" width="228" height="52" class="box-blue"/>
  <text x="384" y="46" class="t-mono">content:</text>
  <rect x="436" y="31" width="50" height="22" class="box-yellow"/>
  <text x="461" y="46" text-anchor="middle" class="t-mono t-b">Notice</text>
  <text x="490" y="46" class="t-mono">[]</text>
  <text x="384" y="67" class="t-gray">나머지 네 칸은 양식 그대로</text>

  <!-- 기기정보 목록 -->
  <text x="372" y="98"><tspan class="t-b">PageResult&lt;McnInfo&gt;</tspan><tspan class="t-gray" dx="8">기기정보 목록</tspan></text>
  <rect x="370" y="106" width="228" height="52" class="box-blue"/>
  <text x="384" y="128" class="t-mono">content:</text>
  <rect x="436" y="113" width="56" height="22" class="box-yellow"/>
  <text x="464" y="128" text-anchor="middle" class="t-mono t-b">McnInfo</text>
  <text x="496" y="128" class="t-mono">[]</text>
  <text x="384" y="149" class="t-gray">나머지 네 칸은 양식 그대로</text>
</svg>
