<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 214">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fill-ink"/></marker>
  </defs>

  <!-- 브라우저(손님) -->
  <rect x="10" y="22" width="112" height="180" class="box"/>
  <text x="66" y="108" text-anchor="middle" class="t-lg">브라우저</text>
  <text x="66" y="128" text-anchor="middle" class="t-gray">손님</text>

  <!-- 서버(은행) -->
  <rect x="478" y="22" width="112" height="180" class="box-blue"/>
  <text x="534" y="108" text-anchor="middle" class="t-lg">서버</text>
  <text x="534" y="128" text-anchor="middle" class="t-gray">은행</text>

  <!-- ① 처음 주소를 칠 때 -->
  <text x="300" y="38" text-anchor="middle"><tspan class="t-b t-blue">① 요청</tspan>  “이 주소의 화면을 주세요”</text>
  <line x1="128" y1="46" x2="472" y2="46" class="line" marker-end="url(#arrow)"/>
  <line x1="472" y1="72" x2="128" y2="72" class="line" marker-end="url(#arrow)"/>
  <text x="134" y="95" text-anchor="start"><tspan class="t-b t-blue">응답</tspan>  화면을 그리는 파일</text>
  <rect x="284" y="81" width="48" height="20" class="box-yellow"/>
  <text x="308" y="95" text-anchor="middle">HTML</text>
  <rect x="338" y="81" width="42" height="20" class="box-yellow"/>
  <text x="359" y="95" text-anchor="middle">CSS</text>
  <rect x="386" y="81" width="84" height="20" class="box-yellow"/>
  <text x="428" y="95" text-anchor="middle">자바스크립트</text>

  <line x1="134" y1="112" x2="466" y2="112" class="line-gray"/>

  <!-- ② 조회를 누를 때 -->
  <text x="300" y="132" text-anchor="middle"><tspan class="t-b t-blue">② 요청</tspan>  “공지 목록을 주세요”</text>
  <line x1="128" y1="140" x2="472" y2="140" class="line" marker-end="url(#arrow)"/>
  <line x1="472" y1="166" x2="128" y2="166" class="line" marker-end="url(#arrow)"/>
  <text x="134" y="189" text-anchor="start"><tspan class="t-b t-blue">응답</tspan>  화면에 채울 자료</text>
  <rect x="284" y="175" width="48" height="20" class="box-yellow"/>
  <text x="308" y="189" text-anchor="middle">JSON</text>
</svg>
