# =====================================================================
# atms-web — JEUS 배포 (서버 atms01 :8080, 컨텍스트 '/')
#  배포킷(nh-atms-server) NH-ATMS atms-web/application-jeus.yml 에서 복사·축소
#  (다른 모듈 주소·게이트웨이·필드 암호화는 뺐다 — 모듈 1개)
#  공통값(DB JNDI·로그 폴더·데이터 폴더)은 atms-common 의 jeus-common.yml
# =====================================================================
spring:
  config:
    import: classpath:jeus-common.yml

logging:
  file:
    name: ${jeus.log-dir}/atms-web.log

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    # 배포킷 헬스체크가 /v3/api-docs = 200 을 본다 (deploy-war.sh) → 문서 JSON 은 켜 둔다
    enabled: true

# 민감필드 암호화 — 키 파일은 WAR 밖 /home/atmswas/keys (jeus 그룹 640). 없으면 기동 실패한다 (NH-ATMS 와 같은 키·경로).
# required: 화면 배포 확인 후 true (그 전까지는 평문도 받음)
crypto:
  field:
    enabled: true
    required: false
    kid: k202611
    private-key-path: /home/atmswas/keys/field-k202611.key.pem
    public-key-path: /home/atmswas/keys/field-k202611.pub.pem
    max-skew-seconds: 120
